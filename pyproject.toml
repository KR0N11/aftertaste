[project]
name = "aftertaste"
version = "0.1.0"
description = "Predicts what a meal will do to your glucose: LLM meal parsing + Dexcom CGM data"
readme = "README.md"
authors = [
    { name = "Ping Chun Lui", email = "kevinlui415@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
aftertaste = "aftertaste.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
